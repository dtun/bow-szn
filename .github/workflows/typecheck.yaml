name: Typecheck

on:
  workflow_dispatch:

jobs:
  typecheck-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run typecheck
        run: npm run typecheck
        working-directory: apps/mobile

  typecheck-core:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run typecheck
        run: npm run typecheck
        working-directory: packages/core

  typecheck-sound:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run typecheck
        run: npm run typecheck
        working-directory: packages/sound

  typecheck-pixels:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run typecheck
        run: npm run typecheck
        working-directory: packages/pixels
