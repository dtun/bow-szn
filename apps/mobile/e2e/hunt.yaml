appId: host.exp.Exponent
---
- openLink: exp://127.0.0.1:8081
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: titleScreen
    timeout: 120000
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
- tapOn:
    id: goHuntingBtn
- assertVisible:
    id: mapScreen
- tapOn:
    id: huntBtn
- assertVisible:
    id: prepScreen
- tapOn:
    id: skipPrepBtn
- assertVisible:
    id: huntScreen
- assertVisible:
    id: mapBtn
- takeScreenshot: hunt-e2e-ready
- swipe:
    start: 50%, 62%
    end: 50%, 78%
    duration: 900
- extendedWaitUntil:
    visible:
      id: shotResult
    timeout: 5000
- takeScreenshot: hunt-e2e-result
- extendedWaitUntil:
    notVisible:
      id: shotResult
    timeout: 8000
- tapOn:
    id: mapBtn
- assertVisible:
    id: mapScreen
- takeScreenshot: hunt-e2e-back-on-map
