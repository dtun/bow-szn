name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run tests
        run: npm test
        working-directory: packages/core

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit, ui, and integration tests
        run: npm test
        working-directory: apps/mobile

  test-mobile-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run snapshot tests
        run: npm run test:snapshot
        working-directory: apps/mobile

  test-sound:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run tests
        run: npm test
        working-directory: packages/sound

  test-sound-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run snapshot tests
        run: npm run test:snapshot
        working-directory: packages/sound

  test-pixels:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: npm test
        working-directory: packages/pixels

      - name: Run snapshot tests
        run: npm run test:snapshot
        working-directory: packages/pixels
