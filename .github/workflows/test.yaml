name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run tests
        run: npm test
        working-directory: packages/core

  test-mobile:
    name: test-mobile-${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - unit
          - ui
          - integration
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Restore Jest cache
        uses: actions/cache@v6
        with:
          path: apps/mobile/.jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/mobile/jest.config.js') }}-${{ matrix.project }}-${{ github.sha }}
          restore-keys: |
            jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'apps/mobile/jest.config.js') }}-${{ matrix.project }}-
            jest-${{ runner.os }}-

      - name: Run ${{ matrix.project }} tests
        run: npx jest --selectProjects ${{ matrix.project }}
        working-directory: apps/mobile

  test-mobile-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run snapshot tests
        run: npm run test:snapshot
        working-directory: apps/mobile

  test-sound:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run tests
        run: npm test
        working-directory: packages/sound

  test-sound-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run snapshot tests
        run: npm run test:snapshot
        working-directory: packages/sound

  test-pixels:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: npm test
        working-directory: packages/pixels

      - name: Run snapshot tests
        run: npm run test:snapshot
        working-directory: packages/pixels
